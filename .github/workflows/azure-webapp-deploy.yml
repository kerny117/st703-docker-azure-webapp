name: Docker Azure Web App Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: st703-docker-azure-webapp
  WEBAPP_NAME: st703-hw2-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Azure App Service container deployment
        run: curl --fail --silent --show-error --request POST "${{ secrets.AZURE_WEBAPP_WEBHOOK_URL }}"
